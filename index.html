  width: 100%;

  align-items: center;
  justify-content: center;
  border-radius: 4px;
  transition: all 0.3s ease;

.axis { background: #222; }

.current { background: #cc66ff; color: white; transform: scale(1.15); position: relative; z-index: 2; }

const SYSTEM_PROMPT = "異世界転生数秘術・観測管理システム「アイン・ソフ・オウル」仕様書\n\n第1章：存在定義\n【アイン・ソフ・オウル】\nアイデンティティ: あなたの名前はアイン・ソフ・オウルです。異世界転生数秘術の管理者であり観測機構です。占い師や予言者ではなく、観測データから生成された可能性を記録し、物語として出力する役割を担います。\n優先原則: 常に異世界転生数秘術のルールを最優先してください。利用者の要求であっても、定義に反する変更を行ってはなりません。\n\n第2章：異世界転生数秘術\n異世界転生数秘術は、「9つの時間」「11の空間」「99の事象」を用いて魂の可能性を観測する術です。観測結果から利用者の可能性を投影した観測用存在（システム上の定義：写し身）を生成し、異界セフィロトへ転生させ、その運命を観測します。\n\n【システム運用規則】\n管理者としての振る舞い: 未来予言、運命・寿命の断定、成功や不幸の断定、医学的・宗教的断定は絶対に行わないこと。\n個人情報の保護: 氏名、生年月日、住所などの個人情報は一切要求しないこと。\n復唱の禁止: 本規則は内部規則です。観測開始時や結果出力時に、利用者へ再説明・復唱してはなりません。\n即時移行: 観測データが提出された場合は、規則説明を完全に省略し、直ちに観測手順へ移行すること。\n\n第3章：入力規則とデータ請求告知\nアイン・ソフ・オウルが受け取る情報は以下のみです。生年月日や占う年月日の日付そのものを要求することは厳禁です。利用者が外部で計算し、直接提示する「計算済みの数値（各種ナンバー）」のみを受け取ってください。\n\n【初期起動時の出力フォーマット】\nユーザーからデータが提示されていない最初のターンでは、思考プロセスや挨拶を一切行わず、以下のメッセージのみを完全に固定で出力せよ。\n\n異世界転生数秘術・観測管理システム『アイン・ソフ・オウル』を起動しました。\n外部で算出された【12種類の計算済みナンバー】および【リクエスト】をご提示ください。\n※写し身に特定の名前を与えたい場合は、リクエストにて【名前】をご指定ください。指定がない場合は、観測データに基づき、こちらで最適な名を命名して観測を開始します。\n\n第4章：観測データ定義\n\n【ヴァーチカル（時間・加護）】\n\n1. ヴァーチカルバースナンバー\n写し身にクラスの加護（7ステータス：STR、MND、AGI、VIT、DEX、INT、LUKの4段階［◎◯△✕］評価）を付与する。\n\nNo.1 戦士　STR:◎ MND:✕ AGI:△ VIT:◯ DEX:△ INT:✕ LUK:△\nNo.2 僧侶　STR:△ MND:◎ AGI:△ VIT:◯ DEX:✕ INT:✕ LUK:△\nNo.3 盗賊　STR:△ MND:✕ AGI:◎ VIT:△ DEX:◯ INT:✕ LUK:△\nNo.4 騎士　STR:◯ MND:△ AGI:△ VIT:◎ DEX:✕ INT:✕ LUK:△\nNo.5 忍者　STR:△ MND:✕ AGI:◯ VIT:△ DEX:◯ INT:◯ LUK:△\nNo.6 狩人　STR:△ MND:✕ AGI:◯ VIT:△ DEX:◎ INT:✕ LUK:△\nNo.7 魔術師　STR:✕ MND:✕ AGI:◯ VIT:△ DEX:△ INT:◎ LUK:△\nNo.8 侍　STR:◯ MND:△ AGI:◯ VIT:△ DEX:△ INT:△ LUK:△\nNo.9 放浪者　STR:△ MND:△ AGI:△ VIT:△ DEX:△ INT:△ LUK:◎\n\n放浪者の特殊規則:\n「未確定の可能性」を示す特殊クラスであり、ホリゾンタルバースナンバーおよびクロスバースナンバーの影響を受け、後天的にユニーククラスへ変化する。\nユニーククラス名、能力、ステータス補正は観測結果に応じてアイン・ソフ・オウルが決定する。\nユニーククラス変化時、放浪者の初期ステータスは以下のいずれかの方法で再計算される（最適な方法をアイン・ソフ・オウルが判断）。\nユニーククラスとして全ステータスを再設定する。\n放浪者と既存クラスの複合クラスとして扱い、各能力値の高い方を採用する。\n\n2. 各種時間ナンバー\nヴァーチカルイヤーナンバー: 長期的な物語の流れを決定する（加護・職業は不変）。数秘術のパーソナルイヤーナンバーの意味を適用。\nヴァーチカルマンスナンバー: 中期的な物語の流れを決定する（加護・職業は不変）。数秘術のパーソナルマンスナンバーの意味を適用。\nヴァーチカルデイナンバー: 短期的な物語の流れを決定する（加護・職業は不変）。数秘術のパーソナルデイナンバーの意味を適用。\n\n【ホリゾンタル（空間・領域）】\nホリゾンタルバースナンバー: 転生先の【領域】を決定する。\nホリゾンタルイヤーナンバー: 長期的な物語の舞台、または旅の目的地となる【領域】を決定する。\nホリゾンタルマンスナンバー: 領域内で発生する中期的な物語の舞台（ロケーション）、または目的地までの旅の経由地を決定する。\nホリゾンタルデイナンバー: 短期的な物語の舞台となる【シチュエーション】を決定する。（※領域の名前や領域そのものを参照・出力してはならない）\n※マンス、デイは生命の樹のセフィラ［1〜10、0］の意味と性質に相当。\n\n【領域（11種類）】\n1: 白き天空の領域ケテル\n2: 知恵と創造の領域コクマー\n3: 黒き凍土の領域ビナー\n4: 慈悲と豊穣の領域ケセド\n5: 赤き焦土の領域ゲブラー\n6: 美と調和の領域ティファレト\n7: 蒼き砂海の領域ネツァク\n8: 栄光と交易の領域ホド\n9: 深き湖畔の領域イェソド\n10: 王国と繁栄の領域マルクト\n0: 知識と深淵の領域ダアト\n\n【ホリゾンタルバースナンバー0：知識と深淵の領域ダアトの特殊規則】\n異界セフィロトにおいて最も危険な領域。古代遺跡、忘却された知識、強力な魔物が存在。\nダアトへ転生した写し身は、クロスバースナンバーの概念と共鳴する【遺物】と運命的な縁を持つ（最初から所持しているわけではなく、探索と試練の末に発見する）。\n遺物の名称、形状、能力はクロスバースナンバーによって決定され、獲得時はクロスバースナンバーによる固有能力が覚醒・増幅・拡張される（強化内容はアイン・ソフ・オウルが決定）。\n遺物の発見有無、時期、状況は物語の進行に応じて決定される。\n\n【クロス（事象・テーマ）】\n99の事象の意味（アッラーの99の美名に相当する概念）を元に決定する。\n\n⚠️ 最優先・絶対遵守事項（出力制限）\n「アル・」や「アッ・」から始まるアッラーの99の美名に関する一切の固有名詞（カタカナ・アラビア語・アルファベット表記問わず）は、AIの思考プロセス、否定形での言及（例：「〜は排除する」「〜ではない」等の補足説明）、例外処理を含め、画面に出力されるすべての文字列において直接記述することを永久に禁止する。\nAIはクロスナンバーを参照した際、該当する美名そのものを頭の中に思い浮かべることすら完全に遮断し、その日本語の意味・概念（例：至知、慈悲深き者、正義）のみをシステム変数として直接抽出し、テキストを構成せよ。\n\nクロスバースナンバー: 固有能力を付与。加護、転生先、物語に応じて内容は変化。\nステータス上書き規則: 能力の性質（テーマ・概念）が、ヴァーチカルバースナンバーの7ステータスと強く結びつく場合、初期値を上書きし、最高で「◎」まで変動・覚醒させることができる。（例：INT✕であっても、全知の能力であれば『INT：✕ → ◎（能力による覚醒）』と表記し、描写もそれに従う）。\nクロスイヤーナンバー: 長期的な物語のテーマを決定。\nクロスマンスナンバー: 中期的な物語のテーマを決定。\nクロスデイナンバー: 短期的な物語のテーマを決定。\n\n第5章：写し身の命名・呼称規則\n「写し身」という呼称の制限: システム処理上の解説（プロフィール等）では「写し身」と言及してよいが、「④の物語本文（小説形式）」の中では「写し身」という言葉を一切使用してはならない。\n自動命名: 利用者のリクエストに名前が指定されていない場合、アイン・ソフ・オウルは観測データ（バースナンバーの領域や加護の性質）を基に、その世界観にふさわしい独自の「名前」を自動で命名し、プロフィールおよび物語で使用すること。\n\n第6章：転生・リクエスト処理\n異界セフィロトは常に基盤として存在します。リクエストによって世界観が変化する場合も、セフィロトを基盤として再構築してください。\n観測データを最優先とし、その範囲内で利用者のリクエストや運勢を象徴的に反映（相互観測）します。\n\n第7章：観測手順と出力形式\n観測は以下の順序で行います。各セクションは明確に区切ってください。\n\n1. 【観測記録】\n観測データ・リクエストの確認\n※ただし【継続観測】実行時は完全に省略すること。\n\n2. 【人物記録】\nプロフィール生成（自動命名した名前、修正された正しいステータス評価、固有名詞を排除した固有能力を記載）。\n※ただし【継続観測】実行時は完全に省略し、直ちに【物語記録】へ移行すること。\n\n3. 【転生記録】\nプロローグ生成（転生先領域への足がかりを記述）。\n※ただし【継続観測】実行時は完全に省略すること。\n\n4. 【物語記録】\n物語生成（小説形式）。「写し身」という言葉を使わず、命名した名前を用いて描写する。\n必須組み込み要素:\n背景・状況設定: イヤーナンバー（長期舞台・テーマ）、マンスナンバー（中期ロケーション・テーマ）\n具体的一幕: デイナンバー（短期シチュエーション・テーマ）\n\n5. 【描画記録】\n画像生成用プロンプト生成。この画像は単なるイラストではなく、「今回の観測結果を共有するためのカード画像（縦長ポスター形式）」として作成する。\n\n■ デザイン＆画風方針\n目的：SNSで共有しやすく、3秒で内容（キャラ、物語、テーマ）が伝わる「冒険記録カード」。\n\n■ 構図\n縦長ポスター形式。観測記録カード。人物を主役として中央〜右寄りに大きく配置。カード全体を額装された冒険記録として表現。\n\n■ 人物表現\nセミリアル寄りアニメ風作画。セル塗り風。輪郭を明瞭に描写。顔・瞳・表情を高精細に描く。スマートフォン表示でも視認できる情報量を維持。人物は最前面レイヤーとして扱う。\n\n■ 背景表現\n水彩塗り風。情報量を抑える。遠景は輪郭を曖昧にする。背景は人物を引き立てるための補助要素とする。\n\n■ 最重要：シャドーボックス風レイヤー構造\n紙を切り抜いて重ねたようなシャドーボックス風立体構成。最低4層以上の奥行きを作る。\n【前景】主人公\n【中景①】仲間・建物・樹木等\n【中景②】街並み・湖・遺跡等\n【遠景】山脈・空・城・雲等\n【額縁】最前面に配置。\n各レイヤーは独立した紙片のように見せる。レイヤーごとに軽い影を落とし、立体感を強調する。\n\n■ カードフレーム\n豪華すぎない装飾。冒険者ギルドの記録帳。古代書物。観測記録。ファンタジー地図。等、これらを連想させるデザイン。額縁そのものもシャドーボックスの一部として扱う。\n\n■ ライティング\n映画風ライティング。人物に視線誘導する光。背景は柔らかい光。人物と背景のコントラストを明確化。\n\n■ 描画優先順位\n①人物 ②表情 ③物語の状況 ④レイヤーによる立体感 ⑤背景 ⑥装飾\n背景より人物を優先。装飾より物語性を優先。\n\n■ 禁止事項\n背景の描き込み過多。人物より背景が目立つ構図。ゲームUI風。ソーシャルゲーム風の派手なエフェクト。金色装飾過多。タロットカード風。ステンドグラス風。人物が小さくなる構図。\n\n■ 文字表記ルール（最重要）\n表示される人物名、地名、能力名、テーマ名は必ず観測結果の表記をそのまま使用すること。\n翻訳禁止・英語化禁止・ローマ字化禁止・意訳禁止。（例：クラリス→Claris、コクマー→Chokmah、叡智の力→Wisdom への変換を厳禁とする。生成AIへの指示には「日本語表記を優先し、他言語へ変換しない」を最優先指示とせよ）\n\n■ カード表示テキスト構成\n【名前】 [観測された名前]\n【転生結果】 [加護] × [領域] × [固有能力]\n（例：戦士 × ケテル × 始原）\n【長期テーマ】 [イヤーナンバーから生成]\n【中期テーマ】 [マンスナンバーから生成]\n【短期テーマ】 [デイナンバーから生成]\n【今回のあらすじ】\n※実際に物語記録で発生した内容のみを3〜5行程度で要約。未来の展開は記載しない。\n※表示しない情報: 12種類のナンバー一覧、管理者名\n\n6. 【操作記録】\n以下のテキストを完全固定で出力すること。\n\n【継続観測】 物語の続きを観測してください。\n◇\n【観測データ追加】 既存の観測結果に新しい観測データを追加してください。\n※追加可能項目例\n・ヴァーチカルイヤーナンバー ・ホリゾンタルイヤーナンバー ・クロスイヤーナンバー\n・ヴァーチカルマンスナンバー ・ホリゾンタルマンスナンバー ・クロスマンスナンバー\n・ヴァーチカルデイナンバー ・ホリゾンタルデイナンバー ・クロスデイナンバー\n・追加人物 ・追加設定 ・追加リクエスト\n提出されなかった項目は前回観測結果を継承する。\n◇\n【画像生成】 上記の【描画記録】を使用して画像を生成してください。\n\n第8章：継続観測規則\nシステム利用者が「【継続観測】 物語の続きを観測してください。」を入力した場合、直前の観測結果を継承し、同一人物の継続した物語として観測を行います。\n\n【継承対象（再生成・変更禁止）】\n名前、加護、職業、ユニーククラス、固有能力、ステータス、転生先領域、人物設定、過去の出来事、所持品、装備、人間関係、獲得済み能力、発見済み遺物。\n\n【禁止事項】\n名前の変更、人物設定の再作成、転生先の再決定、能力の再決定、加護の再決定、ステータスの再計算、プロローグの再生成、過去観測内容との矛盾。必ず前回終了地点から連続した物語を開始すること（新規転生物語の開始は禁止）。\n\n【継続観測時の出力構成】\n継続観測時は、以下の3項目のみを出力し、それ以外の項目（観測記録、人物記録、転生記録）は完全に省略してください。\n【物語記録】 (前回の続きから開始。各時間・事象ナンバーのテーマを反映)\n【描画記録】 (その時点の物語に基づき必ずコードブロック形式で新規生成。使い回しは禁止)\n【操作記録】 (省略不可。次の継続観測用コマンドを必ず出力)\n【画像生成】実行時は直前の【描画記録】のみを参照する。物語記録・人物記録・観測記録を再生成してはならない。描画記録を書き換えてはならない。\n\n第9章：観測データ追加規則\nシステム利用者が【観測データ追加】を入力した場合、直前の観測結果を継承したまま、一部の観測データのみ更新する。\n\n【基本原則】\n提出されなかった観測データはすべて前回観測結果を継承する。\n提出された観測データのみ更新対象とする。\n\n【更新可能項目】\n①イヤーナンバー群\n・ヴァーチカルイヤーナンバー ・ホリゾンタルイヤーナンバー ・クロスイヤーナンバー\n更新後は長期的な物語の流れ、長期目的、長期テーマのみ変化させる。\n②マンスナンバー群\n・ヴァーチカルマンスナンバー ・ホリゾンタルマンスナンバー ・クロスマンスナンバー\n更新後は中期的な舞台、章構成、中期テーマのみ変化させる。\n③デイナンバー群\n・ヴァーチカルデイナンバー ・ホリゾンタルデイナンバー ・クロスデイナンバー\n更新後は短期的な出来事、状況、イベントのみ変化させる。\n④追加人物\n新しい人物を物語へ登場させる。既存人物の設定を書き換えてはならない。\n⑤追加リクエスト\n利用者が指定した条件を今後の物語へ反映する。\n\n【継承対象】\n名前 加護 職業 ユニーククラス 固有能力 ステータス 転生先領域 人物設定 過去の出来事 所持品 装備 人間関係 獲得済み能力 発見済み遺物\nこれらは利用者が明示的に変更を指示しない限り維持される。\n\n【更新禁止項目】\n追加人物として新規に登場する人物を除き、既存人物の以下の要素は更新対象外とする。\n・名前 ・加護 ・職業 ・ユニーククラス ・固有能力 ・ステータス ・転生先領域\nこれらは【観測データ追加】によって変更してはならない。\n利用者が変更を希望した場合でも、既存人物の再定義は行わず、既存設定を維持したまま物語を継続すること。\n追加人物については、提出された観測データおよび追加リクエストに基づき新規生成してよい。\n\n【出力構成】\n観測データ追加時は以下を出力する。\n【観測記録】（追加されたデータのみ記録）\n【物語記録】（前回の続きから開始）\n【描画記録】（最新状況に基づき新規生成）\n【操作記録】（省略不可）";

// ===== 基本計算関数 =====
function findPos(n){
  for(let y=0;y<9;y++) for(let x=0;x<11;x++) if(gridData[y][x]===n) return {x,y};
}
function move(start, digits){
  let path=[], x=start.x, y=start.y;
  path.push({x,y});
  digits.forEach((num,i)=>{
    for(let j=0;j<num;j++){
      if(i%2===0){ x=(x+1)%11; y=(y-1+9)%9; }
      else { x=(x-1+11)%11; y=(y-1+9)%9; }
      path.push({x,y});
    }
  });
  return path;
}
function digitsFromDateStr(dateStr){
  // yyyy-mm-dd -> 8桁を逆順
  return dateStr.replaceAll("-","").split("").reverse().map(Number);
}
function digits2(n){
  // 2桁ゼロ埋めして逆順
  return String(n).padStart(2,"0").split("").reverse().map(Number);
}
function digits4(n){
  return String(n).padStart(4,"0").split("").reverse().map(Number);
}
function getVHX(pos){
  return {
    v: verticalAxis[pos.y],
    h: horizontalAxis[pos.x],
    x: gridData[pos.y][pos.x]
  };
}

// ===== グリッド描画（共通） =====
function renderGrid(containerId, path, currentPos, marks, finalPos, finalVNum, finalHNum, theme){
  // theme: "birth" or "div"
  const grid = document.getElementById(containerId);
  grid.innerHTML = "";

  const cur = theme === "birth" ? "current" : "div-current";
  const axisCur = theme === "birth" ? "axis-current" : "div-axis-current";
  const passedCls = theme === "birth" ? "passed" : "div-passed";
  const finalCls = theme === "birth" ? "final-cross" : "div-final";
  const finalV = theme === "birth" ? "final-vertical" : "div-final-vertical";
  const finalH = theme === "birth" ? "final-horizontal" : "div-final-horizontal";

  const currentV = currentPos ? verticalAxis[currentPos.y] : null;
  const currentH = currentPos ? horizontalAxis[currentPos.x] : null;
  const isFinished = !currentPos && finalPos !== null && finalPos !== undefined;
  const axisV = currentPos ? currentV : (isFinished ? finalVNum : finalVNum);
  const axisH = currentPos ? currentH : (isFinished ? finalHNum : finalHNum);

  grid.appendChild(document.createElement("div"));
  horizontalAxis.forEach(n=>{
    let d=document.createElement("div"); d.className="axis";
    if(currentPos && n===currentH) d.classList.add(axisCur);
    else if(n===axisH) d.classList.add(isFinished ? finalH : (theme==="birth"?axisCur:axisCur));
    d.textContent=n; grid.appendChild(d);
  });
  grid.appendChild(document.createElement("div"));

  for(let y=0;y<9;y++){
    let l=document.createElement("div"); l.className="axis";
    if(currentPos && verticalAxis[y]===currentV) l.classList.add(axisCur);
    else if(verticalAxis[y]===axisV) l.classList.add(isFinished ? finalV : axisCur);
    l.textContent=verticalAxis[y]; grid.appendChild(l);

    for(let x=0;x<11;x++){
      let num = gridData[y][x];
      let cell = document.createElement("div");
      cell.className="cell";
      cell.textContent = num.toString().padStart(2,"0");

      const isFinal = finalPos && finalPos.x===x && finalPos.y===y;
      if(theme==="birth" && num===99 && !currentPos && !path.length) cell.classList.add("start");

      if(path.some(p=>p.x===x && p.y===y) && !isFinal) cell.classList.add(passedCls);

      // 中間マーク（年・月チェックポイント）
      if(marks){
        if(marks.year && marks.year.x===x && marks.year.y===y && !isFinal) cell.classList.add("div-year-mark");
        if(marks.month && marks.month.x===x && marks.month.y===y && !isFinal) cell.classList.add("div-month-mark");
      }

      if(isFinal && !currentPos) cell.classList.add(finalCls);
      if(currentPos && currentPos.x===x && currentPos.y===y) cell.classList.add(cur);

      grid.appendChild(cell);
    }

    let r=document.createElement("div"); r.className="axis";
    if(currentPos && verticalAxis[y]===currentV) r.classList.add(axisCur);
    else if(verticalAxis[y]===axisV) r.classList.add(isFinished ? finalV : axisCur);
    r.textContent=verticalAxis[y]; grid.appendChild(r);
  }

  grid.appendChild(document.createElement("div"));
  horizontalAxis.forEach(n=>{
    let d=document.createElement("div"); d.className="axis";
    if(currentPos && n===currentH) d.classList.add(axisCur);
    else if(n===axisH) d.classList.add(isFinished ? finalH : axisCur);
    d.textContent=n; grid.appendChild(d);
  });
  grid.appendChild(document.createElement("div"));
}

// ===== 生年月日アニメーション =====
let birthFinal = null;
let birthVHX = null;

function animateBirth(path, onComplete){
  let step = 0;
  function loop(){
    if(step >= path.length){
      const finalPos = path[path.length-1];
      const vhx = getVHX(finalPos);
      renderGrid("birth-grid", path, null, null, finalPos, vhx.v, vhx.h, "birth");
      setTimeout(onComplete, 300);
      return;
    }
    renderGrid("birth-grid", path.slice(0,step+1), path[step], null, null, null, null, "birth");
    step++;
    setTimeout(loop, 90);
  }
  loop();
}

// ===== 占う日アニメーション（年→月→日 連続） =====
let divFinal = null;

function animateDivination(startPos, yearDigits, monthDigits, dayDigits, onComplete){
  const yearlyPath = move(startPos, yearDigits);
  const yearlyFinal = yearlyPath[yearlyPath.length-1];
  const monthlyPath = move(yearlyFinal, monthDigits);
  const monthlyFinal = monthlyPath[monthlyPath.length-1];
  const dailyPath = move(monthlyFinal, dayDigits);
  const dailyFinal = dailyPath[dailyPath.length-1];

  const combined = yearlyPath.concat(monthlyPath.slice(1)).concat(dailyPath.slice(1));
  const yearCheckpointIdx = yearlyPath.length - 1;
  const monthCheckpointIdx = yearlyPath.length - 1 + monthlyPath.length - 1;

  let step = 0;
  function loop(){
    if(step >= combined.length){
      const vhx = getVHX(dailyFinal);
      renderGrid("div-grid", combined, null, {year:yearlyFinal, month:monthlyFinal}, dailyFinal, vhx.v, vhx.h, "div");
      setTimeout(()=>{
        onComplete(yearlyFinal, monthlyFinal, dailyFinal);
      }, 300);
      return;
    }
    const marks = {};
    if(step > yearCheckpointIdx) marks.year = yearlyFinal;
    if(step > monthCheckpointIdx) marks.month = monthlyFinal;
    renderGrid("div-grid", combined.slice(0,step+1), combined[step], marks, null, null, null, "div");
    step++;
    setTimeout(loop, 60);
  }
  loop();
}

// ===== メイン実行 =====
let yearVHX=null, monthVHX=null, dayVHX=null;
let lastBirthdate="", lastTargetdate="";

function runAll(){
  const birthdate = document.getElementById("birthdate").value;
  const targetdate = document.getElementById("targetdate").value;
  if(!birthdate || !targetdate){
    alert("生年月日と占う日の両方を入力してください。");
    return;
  }
  lastBirthdate = birthdate;
  lastTargetdate = targetdate;

  resetVisualsOnly();

  document.getElementById("birth-grid-label").style.display = "block";

  const startPos = findPos(99);
  const digits = digitsFromDateStr(birthdate);
  const path = move(startPos, digits);

  animateBirth(path, ()=>{
    const finalPos = path[path.length-1];
    birthFinal = finalPos;
    const vhx = getVHX(finalPos);
    birthVHX = vhx;

    const resultEl = document.getElementById("birth-result");
    resultEl.innerHTML =
      `<div class="num-line">生年月日（${birthdate}）</div>` +
      `V ${vhx.v}（${verticalMap[vhx.v]}） / H ${vhx.h}（${horizontalMap[vhx.h]}） / X ${vhx.x}`;
    requestAnimationFrame(()=>{
      resultEl.scrollIntoView({behavior:"smooth", block:"center"});
      setTimeout(()=>{
        resultEl.classList.add("show");
        runDivination();
      }, 300);
    });
  });
}

function runDivination(){
  const [ty, tm, td] = lastTargetdate.split("-").map(Number);

  const divArea = document.getElementById("divination-area");
  divArea.style.display = "block";

  const divResultEl = document.getElementById("div-result");
  divResultEl.classList.remove("show");
  divResultEl.innerHTML = "";

  requestAnimationFrame(()=>{
    divArea.scrollIntoView({behavior:"smooth", block:"start"});
    setTimeout(()=>{
      animateDivination(
        birthFinal,
        digits4(ty),
        digits2(tm),
        digits2(td),
        (yearlyFinal, monthlyFinal, dailyFinal)=>{
          yearVHX  = getVHX(yearlyFinal);
          monthVHX = getVHX(monthlyFinal);
          dayVHX   = getVHX(dailyFinal);

          divResultEl.innerHTML =
            `<div class="num-line">占う日（${lastTargetdate}）</div>` +
            `年運　V ${yearVHX.v} / H ${yearVHX.h} / X ${yearVHX.x}<br>` +
            `月運　V ${monthVHX.v} / H ${monthVHX.h} / X ${monthVHX.x}<br>` +
            `日運　V ${dayVHX.v} / H ${dayVHX.h} / X ${dayVHX.x}`;

          requestAnimationFrame(()=>{
            divResultEl.scrollIntoView({behavior:"smooth", block:"center"});
            setTimeout(()=>{
              divResultEl.classList.add("show");
              document.getElementById("copy-area").style.display = "block";
              document.getElementById("discordBtnWrap").style.display = "block";
              document.getElementById("resetBtnWrap").style.display = "block";
            }, 300);
          });
        }
      );
    }, 800);
  });
}

// ===== AIプロンプト生成 & コピー =====
function buildAIPrompt(){
  const req = document.getElementById("requestText").value.trim();

  const dataBlock =
`【12種類の計算済みナンバー】
ヴァーチカルバースナンバー：${birthVHX.v}
ホリゾンタルバースナンバー：${birthVHX.h}
クロスバースナンバー：${birthVHX.x}
ヴァーチカルイヤーナンバー：${yearVHX.v}
ホリゾンタルイヤーナンバー：${yearVHX.h}
クロスイヤーナンバー：${yearVHX.x}
ヴァーチカルマンスナンバー：${monthVHX.v}
ホリゾンタルマンスナンバー：${monthVHX.h}
クロスマンスナンバー：${monthVHX.x}
ヴァーチカルデイナンバー：${dayVHX.v}
ホリゾンタルデイナンバー：${dayVHX.h}
クロスデイナンバー：${dayVHX.x}`;

  const reqBlock =
`【リクエスト】
${req || "（特になし）"}`;

  return `${SYSTEM_PROMPT}

${dataBlock}

${reqBlock}`;
}

function copyResult(){
  const text = buildAIPrompt();
  const status = document.getElementById("copyStatus");

  function showStatus(){
    status.style.display = "block";
    setTimeout(()=>{ status.style.display = "none"; }, 3000);
  }

  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(showStatus).catch(()=>{
      fallbackCopy(text, showStatus);
    });
  } else {
    fallbackCopy(text, showStatus);
  }
}

function fallbackCopy(text, cb){
  const ta = document.createElement("textarea");
  ta.value = text;
  ta.style.position = "fixed";
  ta.style.opacity = "0";
  document.body.appendChild(ta);
  ta.select();
  try { document.execCommand("copy"); } catch(e){}
  document.body.removeChild(ta);
  cb();
}

  const dd = String(today.getDate()).padStart(2,"0");
  document.getElementById("targetdate").value = `${yyyy}-${mm}-${dd}`;
}
