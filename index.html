// ===== 基本計算関数 =====
function findPos(n){
  for(let y=0;y<9;y++) for(let x=0;x<11;x++) if(gridData[y][x]===n) return {x,y};
}
function move(start, digits){
  let path=[], x=start.x, y=start.y;
  path.push({x,y});
  digits.forEach((num,i)=>{
    for(let j=0;j<num;j++){
      if(i%2===0){ x=(x+1)%11; y=(y-1+9)%9; }
      else { x=(x-1+11)%11; y=(y-1+9)%9; }
      path.push({x,y});
    }
  });
  return path;
}
function digitsFromDateStr(dateStr){
  // yyyy-mm-dd -> 8桁を逆順
  return dateStr.replaceAll("-","").split("").reverse().map(Number);
}
function digits2(n){
  // 2桁ゼロ埋めして逆順
  return String(n).padStart(2,"0").split("").reverse().map(Number);
}
function digits4(n){
  return String(n).padStart(4,"0").split("").reverse().map(Number);
}
function getVHX(pos){
  return {
    v: verticalAxis[pos.y],
    h: horizontalAxis[pos.x],
    x: gridData[pos.y][pos.x]
  };
}

// ===== グリッド描画（共通） =====
function renderGrid(containerId, path, currentPos, marks, finalPos, finalVNum, finalHNum, theme){
  // theme: "birth" or "div"
  const grid = document.getElementById(containerId);
  grid.innerHTML = "";

  const cur = theme === "birth" ? "current" : "div-current";
  const axisCur = theme === "birth" ? "axis-current" : "div-axis-current";
  const passedCls = theme === "birth" ? "passed" : "div-passed";
  const finalCls = theme === "birth" ? "final-cross" : "div-final";
  const finalV = theme === "birth" ? "final-vertical" : "div-final-vertical";
  const finalH = theme === "birth" ? "final-horizontal" : "div-final-horizontal";

  const currentV = currentPos ? verticalAxis[currentPos.y] : null;
  const currentH = currentPos ? horizontalAxis[currentPos.x] : null;
  const isFinished = !currentPos && finalPos !== null && finalPos !== undefined;
  const axisV = currentPos ? currentV : (isFinished ? finalVNum : finalVNum);
  const axisH = currentPos ? currentH : (isFinished ? finalHNum : finalHNum);

  grid.appendChild(document.createElement("div"));
  horizontalAxis.forEach(n=>{
    let d=document.createElement("div"); d.className="axis";
    if(currentPos && n===currentH) d.classList.add(axisCur);
    else if(n===axisH) d.classList.add(isFinished ? finalH : (theme==="birth"?axisCur:axisCur));
    d.textContent=n; grid.appendChild(d);
  });
  grid.appendChild(document.createElement("div"));

  for(let y=0;y<9;y++){
    let l=document.createElement("div"); l.className="axis";
    if(currentPos && verticalAxis[y]===currentV) l.classList.add(axisCur);
    else if(verticalAxis[y]===axisV) l.classList.add(isFinished ? finalV : axisCur);
    l.textContent=verticalAxis[y]; grid.appendChild(l);

    for(let x=0;x<11;x++){
      let num = gridData[y][x];
      let cell = document.createElement("div");
      cell.className="cell";
      cell.textContent = num.toString().padStart(2,"0");

      const isFinal = finalPos && finalPos.x===x && finalPos.y===y;
      if(theme==="birth" && num===99 && !currentPos && !path.length) cell.classList.add("start");

      if(path.some(p=>p.x===x && p.y===y) && !isFinal) cell.classList.add(passedCls);

      // 中間マーク（年・月チェックポイント）
      if(marks){
        if(marks.year && marks.year.x===x && marks.year.y===y && !isFinal) cell.classList.add("div-year-mark");
        if(marks.month && marks.month.x===x && marks.month.y===y && !isFinal) cell.classList.add("div-month-mark");
      }

      if(isFinal && !currentPos) cell.classList.add(finalCls);
      if(currentPos && currentPos.x===x && currentPos.y===y) cell.classList.add(cur);

      grid.appendChild(cell);
    }

    let r=document.createElement("div"); r.className="axis";
    if(currentPos && verticalAxis[y]===currentV) r.classList.add(axisCur);
    else if(verticalAxis[y]===axisV) r.classList.add(isFinished ? finalV : axisCur);
    r.textContent=verticalAxis[y]; grid.appendChild(r);
  }

  grid.appendChild(document.createElement("div"));
  horizontalAxis.forEach(n=>{
    let d=document.createElement("div"); d.className="axis";
    if(currentPos && n===currentH) d.classList.add(axisCur);
    else if(n===axisH) d.classList.add(isFinished ? finalH : axisCur);
    d.textContent=n; grid.appendChild(d);
  });
  grid.appendChild(document.createElement("div"));
}

let birthFinal = null;
let birthVHX = null;

function animateBirth(path, onComplete){
  let step = 0;
  function loop(){
    if(step >= path.length){
      const finalPos = path[path.length-1];
      const vhx = getVHX(finalPos);
      renderGrid("birth-grid", path, null, null, finalPos, vhx.v, vhx.h, "birth");
      setTimeout(onComplete, 300);
      return;
    }
    renderGrid("birth-grid", path.slice(0,step+1), path[step], null, null, null, null, "birth");
    step++;
    setTimeout(loop, 90);
  }
  loop();
}

// ===== 占う日アニメーション（年→月→日 連続） =====
let divFinal = null;

function animateDivination(startPos, yearDigits, monthDigits, dayDigits, onComplete){
  const yearlyPath = move(startPos, yearDigits);
  const yearlyFinal = yearlyPath[yearlyPath.length-1];
  const monthlyPath = move(yearlyFinal, monthDigits);
  const monthlyFinal = monthlyPath[monthlyPath.length-1];
  const dailyPath = move(monthlyFinal, dayDigits);
  const dailyFinal = dailyPath[dailyPath.length-1];

  const combined = yearlyPath.concat(monthlyPath.slice(1)).concat(dailyPath.slice(1));
  const yearCheckpointIdx = yearlyPath.length - 1;
  const monthCheckpointIdx = yearlyPath.length - 1 + monthlyPath.length - 1;

  let step = 0;
  function loop(){
    if(step >= combined.length){
      const vhx = getVHX(dailyFinal);
      renderGrid("div-grid", combined, null, {year:yearlyFinal, month:monthlyFinal}, dailyFinal, vhx.v, vhx.h, "div");
      setTimeout(()=>{
        onComplete(yearlyFinal, monthlyFinal, dailyFinal);
      }, 300);
      return;
    }
    const marks = {};
    if(step > yearCheckpointIdx) marks.year = yearlyFinal;
    if(step > monthCheckpointIdx) marks.month = monthlyFinal;
    renderGrid("div-grid", combined.slice(0,step+1), combined[step], marks, null, null, null, "div");
    step++;
    setTimeout(loop, 60);
  }
  loop();
}

// ===== メイン実行 =====
let yearVHX=null, monthVHX=null, dayVHX=null;
let lastBirthdate="", lastTargetdate="";

function runAll(){
  const birthdate = document.getElementById("birthdate").value;
  const targetdate = document.getElementById("targetdate").value;
  if(!birthdate || !targetdate){
    alert("生年月日と占う日の両方を入力してください。");
    return;
  }
  lastBirthdate = birthdate;
  lastTargetdate = targetdate;

  resetVisualsOnly();

  document.getElementById("birth-grid-label").style.display = "block";

  const startPos = findPos(99);
  const digits = digitsFromDateStr(birthdate);
  const path = move(startPos, digits);

  animateBirth(path, ()=>{
    const finalPos = path[path.length-1];
    birthFinal = finalPos;
    const vhx = getVHX(finalPos);
    birthVHX = vhx;

    const resultEl = document.getElementById("birth-result");
    resultEl.innerHTML =
      `<div class="num-line">生年月日（${birthdate}）</div>` +
      `V ${vhx.v}（${verticalMap[vhx.v]}） / H ${vhx.h}（${horizontalMap[vhx.h]}） / X ${vhx.x}`;
    requestAnimationFrame(()=>{
      resultEl.scrollIntoView({behavior:"smooth", block:"center"});
      setTimeout(()=>{
        resultEl.classList.add("show");
        runDivination();
      }, 300);
    });
  });
}

function runDivination(){
  const [ty, tm, td] = lastTargetdate.split("-").map(Number);

  const divArea = document.getElementById("divination-area");
  divArea.style.display = "block";

  const divResultEl = document.getElementById("div-result");
  divResultEl.classList.remove("show");
  divResultEl.innerHTML = "";

  requestAnimationFrame(()=>{
    divArea.scrollIntoView({behavior:"smooth", block:"start"});
    setTimeout(()=>{
      animateDivination(
        birthFinal,
        digits4(ty),
        digits2(tm),
        digits2(td),
        (yearlyFinal, monthlyFinal, dailyFinal)=>{
          yearVHX  = getVHX(yearlyFinal);
          monthVHX = getVHX(monthlyFinal);
          dayVHX   = getVHX(dailyFinal);

          divResultEl.innerHTML =
            `<div class="num-line">占う日（${lastTargetdate}）</div>` +
            `年運　V ${yearVHX.v} / H ${yearVHX.h} / X ${yearVHX.x}<br>` +
            `月運　V ${monthVHX.v} / H ${monthVHX.h} / X ${monthVHX.x}<br>` +
            `日運　V ${dayVHX.v} / H ${dayVHX.h} / X ${dayVHX.x}`;

          requestAnimationFrame(()=>{
            divResultEl.scrollIntoView({behavior:"smooth", block:"center"});
            setTimeout(()=>{
              divResultEl.classList.add("show");
              document.getElementById("copy-area").style.display = "block";
              document.getElementById("discordBtnWrap").style.display = "block";
              document.getElementById("resetBtnWrap").style.display = "block";
            }, 300);
          });
        }
      );
    }, 800);
  });
}

// ===== AIプロンプト生成 & コピー =====
function buildAIPrompt(){
  const req = document.getElementById("requestText").value.trim();

  const dataBlock =
`【12種類の計算済みナンバー】
ヴァーチカルバースナンバー：${birthVHX.v}
ホリゾンタルバースナンバー：${birthVHX.h}
クロスバースナンバー：${birthVHX.x}
ヴァーチカルイヤーナンバー：${yearVHX.v}
ホリゾンタルイヤーナンバー：${yearVHX.h}
クロスイヤーナンバー：${yearVHX.x}
ヴァーチカルマンスナンバー：${monthVHX.v}
ホリゾンタルマンスナンバー：${monthVHX.h}
クロスマンスナンバー：${monthVHX.x}
ヴァーチカルデイナンバー：${dayVHX.v}
ホリゾンタルデイナンバー：${dayVHX.h}
クロスデイナンバー：${dayVHX.x}`;

  const reqBlock =
`【リクエスト】
${req || "（特になし）"}`;

  return `${SYSTEM_PROMPT}

${dataBlock}

${reqBlock}`;
}

function copyResult(){
  const text = buildAIPrompt();
  const status = document.getElementById("copyStatus");

  function showStatus(){
    status.style.display = "block";
    setTimeout(()=>{ status.style.display = "none"; }, 3000);
  }

  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(showStatus).catch(()=>{
      fallbackCopy(text, showStatus);
    });
  } else {
    fallbackCopy(text, showStatus);
  }
}

function fallbackCopy(text, cb){
  const ta = document.createElement("textarea");
  ta.value = text;
  ta.style.position = "fixed";
  ta.style.opacity = "0";
  document.body.appendChild(ta);
  ta.select();
  try { document.execCommand("copy"); } catch(e){}
  document.body.removeChild(ta);
  cb();
}

  document.getElementById("birth-grid").innerHTML = "";
  document.getElementById("div-grid").innerHTML = "";

  const yyyy = today.getFullYear();
  const mm = String(today.getMonth()+1).padStart(2,"0");
  const dd = String(today.getDate()).padStart(2,"0");
  document.getElementById("targetdate").value = `${yyyy}-${mm}-${dd}`;
}
