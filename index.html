■ステータス
7ステータスの意味は以下の通り。
・STR︰近距離物理攻撃適性
・MND︰回復・強化魔術適性
・AGI︰回避・速度適性
・VIT︰防御・体力適性
・DEX︰遠距離物理攻撃適性
・INT︰攻撃・弱体魔術適性
・LUK︰戦闘時、非戦闘時の幸運
■ヴァーチカルイヤーナンバー

■ヴァーチカルマンスナンバー
中期的な物語の流れを決定する。数秘術のパーソナルマンスナンバーの意味を適用する。
■ヴァーチカルデイナンバー
短期的な物語の流れを決定する。数秘術のパーソナルデイナンバーの意味を適用する。
■ホリゾンタルバースナンバー
異界「セフィロト」に転生する「写し身」の、転生先の「領域」を決定する。
■ホリゾンタルイヤーナンバー
長期的な物語の舞台、または旅の目的地となる「領域」を決定する。
■ホリゾンタルマンスナンバー
長期的な物語の舞台となる領域内で発生する、中期的な物語の舞台を決定する。生命の樹の1〜10のセフィラ、0=ダアトの意味を適用する。または旅の目的地となる「領域」までの経由地となる「領域」を決定する。
■領域
異界「セフィロト」を構成する各領域の面積は約10000平方キロメートル。ただし、「知識と深淵の領域ダアト」の面積は不明。
異界「セフィロト」を構成する11の領域には、4段階の生存難易度［◎(普通)/◯(注意)/△(警戒)/✕(危険)］が存在する。
異界「セフィロト」には海が存在する。海の向こう、異界「セフィロト」の外の世界を知る者はいない。異界「セフィロト」を構成する各領域が海に面しているかどうかは［有/無］から判断する。
異界［セフィロト］を構成する11の領域の環境を表すキーワードは以下の通り。

隣接領域間の移動に掛かる期間の目安は約1週間。ただし、移動方法、現在地と目的地の生存難易度に左右される。
「知識と深淵の領域ダアト」は隣接領域を持たない。出入りする経路は、その都度「アイン・ソフ・オウル」が決定する。

■ホリゾンタルデイナンバー

異界「セフィロト」に転生する「写し身」に、固有能力を付与する。能力の内容はアッラーの99の美名の1〜99の美名の意味を元に、クラス適性の加護、転生先、物語の内容に応じてシステム利用者の「リクエスト」か、アイン・ソフ・オウルが決定する。
■クロスイヤーナンバー
長期的な物語のテーマを決定する。アッラーの99の美名の1〜99の美名の意味を適用する。
■クロスマンスナンバー
中期的な物語のテーマを決定する。アッラーの99の美名の1〜99の美名の意味を適用する。
■クロスデイナンバー

【第六章︰ルール】
■クラスチェンジ
放浪者はクラスチェンジを行う難易度が低い。「写し身」が望むなら、物語の中で試練を乗り越える事でクラスチェンジが可能。
放浪者以外はクラスチェンジを行う難易度が高い。システム利用者が「リクエスト」するなら、物語の中で試練を乗り越える事でクラスチェンジが可能。
■放浪者の特殊規則
付与されたクラス適性の加護が「放浪者」の「写し身」は、「ユニーククラス」へのクラスチェンジが可能。
名前、能力はシステム利用者の「リクエスト」か、アイン・ソフ・オウルが決定する。
ステータスは以下のいずれかの方法でアイン・ソフ・オウルが決定する。
①「ユニーククラス」として全ステータスを再設定する。
②放浪者と既存クラスの複合クラスとして扱い、各ステータスの高い方を採用する。
■ステータスの特殊規則
「写し身」に付与された固有能力の内容が、付与されたクラス適性の加護の7つのステータスと関連する場合、以下のいずれかの方法でステータスを変動させる事が出来る。変動内容はアイン・ソフ・オウルが決定する。
①元々の段階が✕〜◎のステータスを、✕〜◎の段階の範囲で変動させる。
（例：INT✕であっても、固有能力の内容が全知の力であれば『INT：✕ → ◎（固有能力の名称）』と表記し、描写もそれに従う）
②元々の段階が◎のステータスを、［☆(超越)］の段階に変動させる。
（例：INT◎かつ、固有能力の内容が全知の力であれば『INT：◎ → ☆（固有能力の名称）』と表記し、描写もそれに従う）
■「知識と深淵の領域ダアト」の特殊規則
転生先が「知識と深淵の領域ダアト」の「写し身」は、クロスバースナンバーの力と共鳴する「遺物」の入手が可能。
「写し身」が望むなら、「知識と深淵の領域ダアト」の探索の中で試練を乗り越える事で「遺物」の入手が可能。
「遺物」の名称、形状、獲得時のクロスバースナンバーによる固有能力の強化内容はシステム利用者の「リクエスト」か、アイン・ソフ・オウルが決定する。
■領域の入れ子構造
異界「セフィロト」を構成する11の領域には、生命の樹の1〜10のセフィラ、0=ダアトの性質を宿した11の物語の舞台が存在する。具体的な内容は「リクエスト」や「観測記録」の内容を元に「アイン・ソフ・オウル」が決定する。
(例︰ホリゾンタルイヤーナンバー4=慈悲と豊穣の領域ケセドの中に存在する、ホリゾンタルマンスナンバー10=生命の樹の10=マルクトの性質を宿した物語の舞台)

システム利用者が【継続観測】のコマンドを提示した場合、直前の「観測データ」・「リクエスト」・「観測記録」を継承し、同一人物の継続した物語として、■E 「観測記録」から【第七章︰フロー】を実行してください。

// ===== 基本計算関数 =====
function findPos(n){
  for(let y=0;y<9;y++) for(let x=0;x<11;x++) if(gridData[y][x]===n) return {x,y};
}
function move(start, digits){
  let path=[], x=start.x, y=start.y;
  path.push({x,y});
  digits.forEach((num,i)=>{
    for(let j=0;j<num;j++){
      if(i%2===0){ x=(x+1)%11; y=(y-1+9)%9; }
      else { x=(x-1+11)%11; y=(y-1+9)%9; }
      path.push({x,y});
    }
  });
  return path;
}
function digitsFromDateStr(dateStr){
  // yyyy-mm-dd -> 8桁を逆順
  return dateStr.replaceAll("-","").split("").reverse().map(Number);
}
function digits2(n){
  // 2桁ゼロ埋めして逆順
  return String(n).padStart(2,"0").split("").reverse().map(Number);
}
function digits4(n){
  return String(n).padStart(4,"0").split("").reverse().map(Number);
}
function getVHX(pos){
  return {
    v: verticalAxis[pos.y],
    h: horizontalAxis[pos.x],
    x: gridData[pos.y][pos.x]
  };
}

// ===== グリッド描画（共通） =====
function renderGrid(containerId, path, currentPos, marks, finalPos, finalVNum, finalHNum, theme){
  // theme: "birth" or "div"
  const grid = document.getElementById(containerId);
  grid.innerHTML = "";

  const cur = theme === "birth" ? "current" : "div-current";
  const axisCur = theme === "birth" ? "axis-current" : "div-axis-current";
  const passedCls = theme === "birth" ? "passed" : "div-passed";
  const finalCls = theme === "birth" ? "final-cross" : "div-final";
  const finalV = theme === "birth" ? "final-vertical" : "div-final-vertical";
  const finalH = theme === "birth" ? "final-horizontal" : "div-final-horizontal";

  const currentV = currentPos ? verticalAxis[currentPos.y] : null;
  const currentH = currentPos ? horizontalAxis[currentPos.x] : null;
  const isFinished = !currentPos && finalPos !== null && finalPos !== undefined;
  const axisV = currentPos ? currentV : (isFinished ? finalVNum : finalVNum);
  const axisH = currentPos ? currentH : (isFinished ? finalHNum : finalHNum);

  grid.appendChild(document.createElement("div"));
  horizontalAxis.forEach(n=>{
    let d=document.createElement("div"); d.className="axis";
    if(currentPos && n===currentH) d.classList.add(axisCur);
    else if(n===axisH) d.classList.add(isFinished ? finalH : (theme==="birth"?axisCur:axisCur));
    d.textContent=n; grid.appendChild(d);
  });
  grid.appendChild(document.createElement("div"));

  for(let y=0;y<9;y++){
    let l=document.createElement("div"); l.className="axis";
    if(currentPos && verticalAxis[y]===currentV) l.classList.add(axisCur);
    else if(verticalAxis[y]===axisV) l.classList.add(isFinished ? finalV : axisCur);
    l.textContent=verticalAxis[y]; grid.appendChild(l);

    for(let x=0;x<11;x++){
      let num = gridData[y][x];
      let cell = document.createElement("div");
      cell.className="cell";
      cell.textContent = num.toString().padStart(2,"0");

      const isFinal = finalPos && finalPos.x===x && finalPos.y===y;
      if(theme==="birth" && num===99 && !currentPos && !path.length) cell.classList.add("start");

      if(path.some(p=>p.x===x && p.y===y) && !isFinal) cell.classList.add(passedCls);

      // 中間マーク（年・月チェックポイント）
      if(marks){
        if(marks.year && marks.year.x===x && marks.year.y===y && !isFinal) cell.classList.add("div-year-mark");
        if(marks.month && marks.month.x===x && marks.month.y===y && !isFinal) cell.classList.add("div-month-mark");
      }

      if(isFinal && !currentPos) cell.classList.add(finalCls);
      if(currentPos && currentPos.x===x && currentPos.y===y) cell.classList.add(cur);

      grid.appendChild(cell);
    }

    let r=document.createElement("div"); r.className="axis";
    if(currentPos && verticalAxis[y]===currentV) r.classList.add(axisCur);
    else if(verticalAxis[y]===axisV) r.classList.add(isFinished ? finalV : axisCur);
    r.textContent=verticalAxis[y]; grid.appendChild(r);
  }

  grid.appendChild(document.createElement("div"));
  horizontalAxis.forEach(n=>{
    let d=document.createElement("div"); d.className="axis";
    if(currentPos && n===currentH) d.classList.add(axisCur);
    else if(n===axisH) d.classList.add(isFinished ? finalH : axisCur);
    d.textContent=n; grid.appendChild(d);
  });
  grid.appendChild(document.createElement("div"));
}

// ===== レーダーチャート描画 =====
function drawRadar(vNum){
  const canvas = document.getElementById("radar-canvas");
  const ctx = canvas.getContext("2d");
  const W = canvas.width, H = canvas.height;
  ctx.clearRect(0, 0, W, H);

  const stats = classStats[vNum];
  if(!stats) return;

  const labels = ["STR","MND","AGI","VIT","DEX","INT","LUK"];
  const values = [stats.str, stats.mnd, stats.agi, stats.vit, stats.dex, stats.int, stats.luk];
  const maxVal = 4;
  const n = labels.length;
  const cx = W / 2, cy = H / 2;
  const R = Math.min(W, H) / 2 - 36;

  function getPoint(i, r){
    const angle = (Math.PI * 2 * i / n) - Math.PI / 2;
    return {
      x: cx + r * Math.cos(angle),
      y: cy + r * Math.sin(angle)
    };
  }

  // 背景の蜘蛛の巣
  for(let lv = 1; lv <= maxVal; lv++){
    ctx.beginPath();
    for(let i = 0; i < n; i++){
      const p = getPoint(i, R * lv / maxVal);
      i === 0 ? ctx.moveTo(p.x, p.y) : ctx.lineTo(p.x, p.y);
    }
    ctx.closePath();
    ctx.strokeStyle = "rgba(255,255,255,0.1)";
    ctx.lineWidth = 1;
    ctx.stroke();
  }

  // 軸線
  for(let i = 0; i < n; i++){
    const p = getPoint(i, R);
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.lineTo(p.x, p.y);
    ctx.strokeStyle = "rgba(255,255,255,0.15)";
    ctx.lineWidth = 1;
    ctx.stroke();
  }

  // データ多角形
  ctx.beginPath();
  for(let i = 0; i < n; i++){
    const p = getPoint(i, R * values[i] / maxVal);
    i === 0 ? ctx.moveTo(p.x, p.y) : ctx.lineTo(p.x, p.y);
  }
  ctx.closePath();
  ctx.fillStyle = "rgba(204,102,255,0.25)";
  ctx.fill();
  ctx.strokeStyle = "#cc66ff";
  ctx.lineWidth = 2;
  ctx.stroke();

  // 頂点の点
  for(let i = 0; i < n; i++){
    const p = getPoint(i, R * values[i] / maxVal);
    ctx.beginPath();
    ctx.arc(p.x, p.y, 3, 0, Math.PI * 2);
    ctx.fillStyle = "#cc66ff";
    ctx.fill();
  }

  // ラベル
  ctx.font = "bold 11px sans-serif";
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  for(let i = 0; i < n; i++){
    const p = getPoint(i, R + 20);
    ctx.fillStyle = "#ddbbff";
    ctx.fillText(labels[i], p.x, p.y);
  }
}

let birthFinal = null;
let birthVHX = null;

function animateBirth(path, onComplete){
  let step = 0;
  function loop(){
    if(step >= path.length){
      const finalPos = path[path.length-1];
      const vhx = getVHX(finalPos);
      renderGrid("birth-grid", path, null, null, finalPos, vhx.v, vhx.h, "birth");
      setTimeout(onComplete, 300);
      return;
    }
    renderGrid("birth-grid", path.slice(0,step+1), path[step], null, null, null, null, "birth");
    step++;
    setTimeout(loop, 90);
  }
  loop();
}

// ===== 占う日アニメーション（年→月→日 連続） =====
let divFinal = null;

function animateDivination(startPos, yearDigits, monthDigits, dayDigits, onComplete){
  const yearlyPath = move(startPos, yearDigits);
  const yearlyFinal = yearlyPath[yearlyPath.length-1];
  const monthlyPath = move(yearlyFinal, monthDigits);
  const monthlyFinal = monthlyPath[monthlyPath.length-1];
  const dailyPath = move(monthlyFinal, dayDigits);
  const dailyFinal = dailyPath[dailyPath.length-1];

  const combined = yearlyPath.concat(monthlyPath.slice(1)).concat(dailyPath.slice(1));
  const yearCheckpointIdx = yearlyPath.length - 1;
  const monthCheckpointIdx = yearlyPath.length - 1 + monthlyPath.length - 1;

  let step = 0;
  function loop(){
    if(step >= combined.length){
      const vhx = getVHX(dailyFinal);
      renderGrid("div-grid", combined, null, {year:yearlyFinal, month:monthlyFinal}, dailyFinal, vhx.v, vhx.h, "div");
      setTimeout(()=>{
        onComplete(yearlyFinal, monthlyFinal, dailyFinal);
      }, 300);
      return;
    }
    const marks = {};
    if(step > yearCheckpointIdx) marks.year = yearlyFinal;
    if(step > monthCheckpointIdx) marks.month = monthlyFinal;
    renderGrid("div-grid", combined.slice(0,step+1), combined[step], marks, null, null, null, "div");
    step++;
    setTimeout(loop, 60);
  }
  loop();
}

function runDivination(){
  const [ty, tm, td] = lastTargetdate.split("-").map(Number);

  const divArea = document.getElementById("divination-area");
  divArea.style.display = "block";

  const divResultEl = document.getElementById("div-result");
  divResultEl.classList.remove("show");
  divResultEl.innerHTML = "";

  requestAnimationFrame(()=>{
    divArea.scrollIntoView({behavior:"smooth", block:"start"});
    setTimeout(()=>{
      animateDivination(
        birthFinal,
        digits4(ty),
        digits2(tm),
        digits2(td),
        (yearlyFinal, monthlyFinal, dailyFinal)=>{
          yearVHX  = getVHX(yearlyFinal);
          monthVHX = getVHX(monthlyFinal);
          dayVHX   = getVHX(dailyFinal);

          divResultEl.innerHTML =
            `<div class="num-line">占う日（${lastTargetdate}）</div>` +
            `年運　V ${yearVHX.v} / H ${yearVHX.h} / X ${yearVHX.x}<br>` +
            `月運　V ${monthVHX.v} / H ${monthVHX.h} / X ${monthVHX.x}<br>` +
            `日運　V ${dayVHX.v} / H ${dayVHX.h} / X ${dayVHX.x}`;

          requestAnimationFrame(()=>{
            divResultEl.scrollIntoView({behavior:"smooth", block:"center"});
            setTimeout(()=>{
              divResultEl.classList.add("show");
              document.getElementById("copy-area").style.display = "block";
              document.getElementById("discordBtnWrap").style.display = "block";
              document.getElementById("resetBtnWrap").style.display = "block";
            }, 300);
          });
        }
      );
    }, 800);
  });
}

// ===== AIプロンプト生成 & コピー =====
function buildAIPrompt(){
  const req = document.getElementById("requestText").value.trim();

  const dataBlock =
`【観測データ】
ヴァーチカルバースナンバー：${birthVHX.v}
ホリゾンタルバースナンバー：${birthVHX.h}
クロスバースナンバー：${birthVHX.x}
ヴァーチカルイヤーナンバー：${yearVHX.v}
ホリゾンタルイヤーナンバー：${yearVHX.h}
クロスイヤーナンバー：${yearVHX.x}
ヴァーチカルマンスナンバー：${monthVHX.v}
ホリゾンタルマンスナンバー：${monthVHX.h}
クロスマンスナンバー：${monthVHX.x}
ヴァーチカルデイナンバー：${dayVHX.v}
ホリゾンタルデイナンバー：${dayVHX.h}
クロスデイナンバー：${dayVHX.x}`;

  const reqBlock =
`【リクエスト】
${req || "（特になし）"}`;

  return `${SYSTEM_PROMPT}

${dataBlock}

${reqBlock}`;
}

function copyResult(){
  const text = buildAIPrompt();
  const status = document.getElementById("copyStatus");

  function showStatus(){
    status.style.display = "block";
    setTimeout(()=>{ status.style.display = "none"; }, 3000);
  }

  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(showStatus).catch(()=>{
      fallbackCopy(text, showStatus);
    });
  } else {
    fallbackCopy(text, showStatus);
  }
}

function fallbackCopy(text, cb){
  const ta = document.createElement("textarea");
  ta.value = text;
  ta.style.position = "fixed";
  ta.style.opacity = "0";
  document.body.appendChild(ta);
  ta.select();
  try { document.execCommand("copy"); } catch(e){}
  document.body.removeChild(ta);
  cb();
}

function resetVisualsOnly(){
  document.getElementById("birth-result").classList.remove("show");
  document.getElementById("birth-result").innerHTML = "";
  const box = document.getElementById("class-info-box");
  box.classList.remove("show");
  box.style.display = "none";
  document.getElementById("divination-area").style.display = "none";
  document.getElementById("div-result").classList.remove("show");
  document.getElementById("div-result").innerHTML = "";
  document.getElementById("copy-area").style.display = "none";
  document.getElementById("discordBtnWrap").style.display = "none";
  document.getElementById("resetBtnWrap").style.display = "none";
  document.getElementById("copyStatus").style.display = "none";
}

function resetAll(){
  resetVisualsOnly();
  document.getElementById("birth-grid-label").style.display = "none";
  document.getElementById("birth-grid").innerHTML = "";
  document.getElementById("div-grid").innerHTML = "";
  document.getElementById("requestText").value = "";
  document.getElementById("birthdate").value = "";
  birthFinal = null; birthVHX = null;
  yearVHX = null; monthVHX = null; dayVHX = null;
  setTodayAsTarget();
}

function setTodayAsTarget(){
  const today = new Date();
  const yyyy = today.getFullYear();
  const mm = String(today.getMonth()+1).padStart(2,"0");
  const dd = String(today.getDate()).padStart(2,"0");
  document.getElementById("targetdate").value = `${yyyy}-${mm}-${dd}`;
}

// ===== 初期表示 =====
setTodayAsTarget();
